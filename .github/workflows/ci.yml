name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Check relative Markdown links
        run: python .github/scripts/check_links.py

  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        if: hashFiles('tests/host/CMakeLists.txt') != ''
        run: cmake -S tests/host -B build/host
      - name: Build
        if: hashFiles('tests/host/CMakeLists.txt') != ''
        run: cmake --build build/host --parallel
      - name: Test
        if: hashFiles('tests/host/CMakeLists.txt') != ''
        run: ctest --test-dir build/host --output-on-failure

  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Check changelog fragment
        run: python .github/scripts/check_changelog.py

  esphome-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install ESPHome
        run: python -m pip install -r requirements-dev.txt
      - name: Prepare dummy secrets and local component
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          key = base64.b64encode(os.urandom(32)).decode()
          Path("secrets.yaml").write_text(
              'wifi_ssid: "ci-ssid"\n'
              'wifi_password: "ci-password"\n'
              'fallback_ap_ssid: "ci-fallback"\n'
              'fallback_ap_password: "ci-fallback-password"\n'
              f'api_encryption_key: "{key}"\n',
              encoding="utf-8",
          )
          PY
          ln -s components my_components
      - name: Validate local YAML
        run: python -m esphome config sonoff_powct_local_version.yaml
      - name: Validate distant YAML
        run: python -m esphome config sonoff_powct_distant_version.yaml

  esphome-compile:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install ESPHome
        run: python -m pip install -r requirements-dev.txt
      - name: Cache ESPHome build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/esphome
            .esphome
          key: esphome-${{ runner.os }}-${{ hashFiles('requirements-dev.txt', 'sonoff_powct_local_version.yaml', 'components/cse7761/**') }}
      - name: Prepare dummy secrets and local component
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          key = base64.b64encode(os.urandom(32)).decode()
          Path("secrets.yaml").write_text(
              'wifi_ssid: "ci-ssid"\n'
              'wifi_password: "ci-password"\n'
              'fallback_ap_ssid: "ci-fallback"\n'
              'fallback_ap_password: "ci-fallback-password"\n'
              f'api_encryption_key: "{key}"\n',
              encoding="utf-8",
          )
          PY
          ln -s components my_components
      - name: Compile local YAML
        run: python -m esphome compile sonoff_powct_local_version.yaml

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz | tar -xz -C /tmp gitleaks
      - name: Scan repository for secrets
        run: /tmp/gitleaks detect --source . --no-git --config .gitleaks.toml --verbose --redact
